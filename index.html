<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Maya · Teorema Pythagoras</title>
<style>
:root{--ink:#1e2742;--muted:#5a6485;--line:#e6eaf5;--brand:#4a5ee0;--ok:#0f7d62}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e8ecf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;background:radial-gradient(1200px 800px at 18% 8%,#eaf1ff,#f7f3ee 48%,#eef4f7)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%);transform-origin:center;background:linear-gradient(160deg,#fbfcff,#f4f1fb 52%,#eef7f4);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(35,52,96,.18);display:flex;flex-direction:column}
.topbar{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.75)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,#5b6ee1,#8a7cf0);color:#fff;font-size:19px;font-weight:900}
.brand h1{font-size:16.5px;font-weight:800}.brand p{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
.progwrap{width:290px}.proglabel{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}.proglabel b{color:var(--brand)}
.progbar{height:10px;border-radius:99px;background:#e6ebf7;overflow:hidden}
#progFill{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6d8bff,#8a7cf0,#2fb8a6);transition:width .4s}
.tabs{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.55)}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 13px;border-radius:11px;border:1px solid transparent;background:transparent;cursor:pointer;font:700 12.5px inherit;font-family:inherit;color:var(--muted);white-space:nowrap}
.tab:hover{background:#eef2fd}.tab.on{background:linear-gradient(135deg,#5b6ee1,#8a7cf0);color:#fff}
.tab .num{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:#e7ecfa}.tab.on .num{background:rgba(255,255,255,.28)}
.tick{display:none;font-weight:900;color:#17a884}.tab.done .tick{display:inline}.tab.on .tick{color:#c8ffe9}
.content{flex:1;min-height:0;padding:14px}
.panel{display:none;height:100%;gap:0;grid-template-columns:var(--c1,296px) 14px minmax(0,1fr) 14px var(--c3,300px)}
.panel.on{display:grid}#p6{grid-template-columns:1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 22px rgba(35,52,96,.06);display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}
.card-h{padding:10px 14px;font-size:12px;font-weight:800;color:var(--muted);border-bottom:1px solid #f0f3fa;background:#fbfcff;display:flex;align-items:center;gap:8px}
.hint{margin-left:auto;font-size:10.5px;font-weight:700;color:#646e8a;background:#f2f5fd;padding:3px 8px;border-radius:99px}
.card-b{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.canvas-wrap{flex:1;min-height:0;padding:8px}
.canvas-wrap svg{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.ctl{margin-bottom:13px}
.ctl>label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.val{background:#eef2ff;color:var(--brand);padding:2px 9px;border-radius:8px;font-size:12px;font-weight:800}
/* slider: area sentuh 44px, thumb 28px */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;display:block;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#c3d3ff,#e6ecff)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #5b6ee1;margin-top:-10px;box-shadow:0 2px 7px rgba(60,80,180,.4)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#dbe3ff}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #5b6ee1}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:44px;border:none;border-radius:11px;padding:0 14px;font:800 13px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,#5b6ee1,#8a7cf0);box-shadow:0 8px 18px rgba(91,110,225,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#f2f5ff;color:var(--brand);border:1px solid #dbe3ff;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border-radius:99px;background:#f3f6fd;border:1px solid #dfe6f8;font:700 12px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
.chip.on{background:#e8fbf4;border-color:#a9e6cf;color:#12866a}
.chip.sel{background:#eef2ff;border-color:#9fb0f5;color:var(--brand)}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.trio input{width:100%;height:46px;border-radius:11px;border:1.5px solid #dde4f5;background:#fbfcff;font:800 18px inherit;font-family:inherit;text-align:center;color:#3a4570;outline:none;-moz-appearance:textfield}
.trio input::-webkit-outer-spin-button,.trio input::-webkit-inner-spin-button{-webkit-appearance:none}
.trio input:focus{border-color:#8a9cf0}
.steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.step{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:#f1f4fb;color:#646e8a;border:1px solid #e7ecf7}
.step.active{background:#fff4e0;border-color:#ffd79a;color:#9a5f0f}.step.done{background:#e9faf3;border-color:#a9e6cf;color:#12866a}
.eq{background:linear-gradient(135deg,#f3f6ff,#fbf6ff);border:1px solid #e4e9fb;border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.75;color:#3a4570}
.eq .hi{color:#4a5ee0;font-weight:800}.eq .big{font-size:14.5px;font-weight:900;color:#12866a}.eq .mut{color:#646e8a}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{background:#f4f7fe;color:var(--muted);font-weight:800;padding:6px 5px;border-bottom:1px solid #e8edf9;font-size:10.5px}
.tbl td{padding:6px 5px;text-align:center;border-bottom:1px solid #f2f5fc;font-weight:600}
.tbl tr.pick{cursor:pointer}.tbl tr.pick:hover td{background:#eef2ff}
.tblwrap{margin-top:10px;border:1px solid #eef2fa;border-radius:11px;max-height:150px;overflow-y:auto}
.note{margin-top:10px;font-size:11.5px;line-height:1.55;color:var(--muted);background:#f6fbf9;border:1px dashed #bfe6da;border-radius:11px;padding:9px 11px;font-weight:600}
.note.ok{background:#eefbf5;border-color:#a7e4cf;color:#12795f}.note.warn{background:#fff8ec;border-color:#ffdca8;color:#8a5a0e}.note.bad{background:#fdf0f2;border-color:#f6c6ce;color:#b23a4c}
.verdict{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:900;border:1px solid}
.verdict.ok{background:#e9faf3;color:#0f7d62;border-color:#a9e6cf}.verdict.bad{background:#fdf0f2;color:#b23a4c;border-color:#f6c6ce}.verdict.mid{background:#fff8ec;color:#8a5a0e;border-color:#ffdca8}
.verdict .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eef2fa;font-size:12px}.kv span{color:var(--muted);font-weight:700}.kv b{font-weight:900}
.barrow{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:8px;margin-top:8px}
.barrow span{font-size:11px;font-weight:800;color:var(--muted)}.barrow .bar{height:11px;border-radius:99px;background:#eef2fb;overflow:hidden}
.barrow .bar i{display:block;height:100%;border-radius:99px;transition:width .3s;background:linear-gradient(90deg,#6d8bff,#8a7cf0)}.barrow .bar i.c{background:linear-gradient(90deg,#2fb8a6,#7fe0c9)}
.barrow b{font-size:11px;text-align:right}
.modebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.modebtn{min-height:52px;border-radius:12px;border:1.5px solid #e2e8f7;background:#fbfcff;font:800 12px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
.modebtn small{display:block;font-size:10px;font-weight:700;color:#646e8a}
.modebtn.on{background:#eef2ff;border-color:#9fb0f5;color:var(--brand)}
.concl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.concl{padding:13px;border-radius:14px;border:1px solid #eef2fa;background:#fbfcff;position:relative;min-height:170px}
.concl.locked{opacity:.5}.concl .cn{font-size:10.5px;font-weight:900;color:#646e8a}
.concl h4{font-size:13px;font-weight:800;margin:5px 0 7px}
.concl .f{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:800;color:var(--brand);background:#eef2ff;border-radius:8px;padding:5px 7px;display:inline-block;margin-bottom:7px}
.concl p{font-size:11px;line-height:1.5;color:var(--muted);font-weight:600}.concl .badge{position:absolute;top:10px;right:10px}
.finalbanner{margin-top:14px;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#eef2ff,#f6f0ff 45%,#eafaf4);border:1px solid #e0e7fb}
.fb-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,#5b6ee1,#8a7cf0);flex:0 0 auto}
.finalbanner h3{font-size:14px;font-weight:900;margin-bottom:3px}.finalbanner p{font-size:12px;color:var(--muted);font-weight:600;line-height:1.5}
.tps{margin-top:12px;font-size:11px;line-height:1.6;color:var(--muted);font-weight:600}
body{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #8a7cf0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.split{position:relative;display:flex;align-items:center;justify-content:center;cursor:col-resize;touch-action:none;outline:none}
.split::before{content:"";position:absolute;top:0;bottom:0;left:-12px;right:-12px}
.split::after{content:"";width:5px;height:56px;border-radius:99px;background:#cdd6ee;transition:background .15s}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:#6d82ee}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <header class="topbar">
    <div class="brand"><div class="logo">△</div>
      <div><h1>Lab Maya · Teorema Pythagoras</h1><p>Matematika · Fase D / Kelas 8 · Geometri: Segitiga dan Teorema Pythagoras</p></div></div>
    <div class="progwrap"><div class="proglabel"><span>Progres Eksperimen</span><b id="progTxt">0 / 5</b></div>
      <div class="progbar"><i id="progFill"></i></div></div>
  </header>
  <nav class="tabs">
    <button class="tab on" data-panel="p1"><span class="num">1</span>Eksplorasi Teorema<span class="tick">✓</span></button>
    <button class="tab" data-panel="p2"><span class="num">2</span>Tripel Pythagoras<span class="tick">✓</span></button>
    <button class="tab" data-panel="p3"><span class="num">3</span>Jenis Segitiga<span class="tick">✓</span></button>
    <button class="tab" data-panel="p4"><span class="num">4</span>Segitiga Istimewa<span class="tick">✓</span></button>
    <button class="tab" data-panel="p5"><span class="num">5</span>Kontekstual<span class="tick">✓</span></button>
    <button class="tab" data-panel="p6"><span class="num">★</span>Kesimpulan</button>
  </nav>
  <main class="content" id="main"></main>
</div></div>

<script>
(function(){
"use strict";
/* ===== UTILITAS ===== */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}
function fmt(n){var r=Math.round(n*100)/100;return Math.abs(r-Math.round(r))<1e-9?String(Math.round(r)):r.toFixed(2).replace(/\.?0+$/,'')}
function setSteps(sel,n){Array.prototype.forEach.call($(sel).children,function(c,i){c.classList.toggle('done',i<n-1);c.classList.toggle('active',i===n-1)})}
function steps(id,labels){return '<div class="steps" id="'+id+'">'+labels.map(function(l,i){return '<span class="step">'+(i+1)+' '+l+'</span>'}).join('')+'</div>'}
function slider(id,min,max,val){return '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="1" value="'+val+'">'}
function ctlSlider(lab,vid,id,min,max,val){return '<div class="ctl"><label>'+lab+' <span class="val" id="'+vid+'">'+val+'</span></label>'+slider(id,min,max,val)+'</div>'}

/* ===== KERANGKA PANEL (3 kolom: Kontrol | Kanvas | Hasil) ===== */
function SPL(n){return '<div class="split" data-s="'+n+'" role="separator" aria-orientation="vertical" tabindex="0" title="Tarik untuk mengubah ukuran · klik dua kali untuk mengembalikan" aria-label="'+(n===1?'Ubah lebar Kontrol Eksperimen':'Ubah lebar Hasil Pengamatan')+'"></div>'}
function shell(id,ctrl,hint,res,on){
  return '<section class="panel'+(on?' on':'')+'" id="'+id+'"><aside class="card"><div class="card-h">🎛️ Kontrol Eksperimen</div><div class="card-b">'+ctrl+
    '</div></aside>'+SPL(1)+'<div class="card"><div class="card-h">📐 Kanvas Simulasi<span class="hint">'+hint+'</span></div><div class="canvas-wrap"><svg id="svg'+id.slice(1)+'" xmlns="http://www.w3.org/2000/svg"></svg></div></div>'+
    SPL(2)+'<aside class="card"><div class="card-h">🔎 Hasil Pengamatan</div><div class="card-b">'+res+'</div></aside></section>';
}
var h='';
h+=shell('p1',
  '<div class="ctl"><label>Alat bantu pada sisi</label><div class="chips" id="chips1"><span class="chip sel" data-t="sq">Persegi luas</span><span class="chip" data-t="grid">Kisi satuan</span><span class="chip" data-t="none">Polos</span></div></div>'+
  ctlSlider('Sisi tegak <b>a</b>','v1a','s1a',3,12,3)+ctlSlider('Sisi datar <b>b</b>','v1b','s1b',3,12,4)+
  '<div class="ctl"><button class="btn" id="btn1play">▶ Animasikan Bukti Luas</button></div><div class="ctl"><button class="btn ghost" id="btn1acak">🎲 Acak Nilai Sisi</button></div>'+steps('steps1',['Atur','Amati','Catat','Simpulkan']),
  'geser titik biru pada segitiga',
  '<div class="eq" id="eq1"></div><button class="btn" id="btn1rec" style="margin-top:10px">📌 Catat Data Pengamatan</button><div class="tblwrap"><table class="tbl" id="tbl1"></table></div><div class="note" id="note1"></div>',true);
h+=shell('p2',
  '<div class="ctl"><label>Bilangan (a, b, c) <span class="val">1–100</span></label><div class="trio"><input type="number" id="t2a" value="3" min="1" max="100" placeholder="a" inputmode="numeric"><input type="number" id="t2b" value="4" min="1" max="100" placeholder="b" inputmode="numeric"><input type="number" id="t2c" value="5" min="1" max="100" placeholder="c" inputmode="numeric"></div>'+
  '<div class="note" style="margin-top:8px;font-size:11px">💡 <b>Cukup isi SATU bilangan</b> → semua tripel yang memuat bilangan itu dicari otomatis.</div></div>'+
  '<div class="ctl"><button class="btn" id="btn2cek">🔍 Uji / Cari Tripel</button><button class="btn ghost" id="btn2clear" style="margin-top:8px">🧹 Kosongkan Semua Kotak</button></div>'+
  ctlSlider('Kalikan dengan k','v2k','s2k',1,6,2)+'<div class="ctl"><button class="btn ghost" id="btn2play">▶ Animasi kelipatan k = 1 → 6</button></div>'+
  '<div class="ctl"><label>Contoh tripel populer</label><div class="chips" id="chips2"><span class="chip" data-t="3,4,5">3·4·5</span><span class="chip" data-t="5,12,13">5·12·13</span><span class="chip" data-t="8,15,17">8·15·17</span><span class="chip" data-t="7,24,25">7·24·25</span><span class="chip" data-t="20,21,29">20·21·29</span><span class="chip" data-t=",,12">hanya 12</span></div></div>'+
  steps('steps2',['Masukkan','Uji/Cari','Kumpulkan','Simpulkan']),
  'segitiga dari tripel yang ditemukan',
  '<div class="verdict bad" id="vd2"></div><div class="eq" id="eq2" style="margin-top:10px"></div><div class="tblwrap"><table class="tbl" id="tbl2"></table></div><div class="note" id="note2"></div>');
h+=shell('p3',
  ctlSlider('Sisi 1','v3a','s3a',2,20,5)+ctlSlider('Sisi 2','v3b','s3b',2,20,12)+ctlSlider('Sisi 3','v3c','s3c',2,20,13)+
  '<div class="ctl"><button class="btn" id="btn3play">▶ Animasi Sisi 3 (2 → 20)</button></div><div class="ctl"><button class="btn ghost" id="btn3acak">🎲 Acak Sisi</button></div>'+steps('steps3',['Atur','Bandingkan','Temukan','Simpulkan']),
  'segitiga bergerak mengikuti panjang sisi',
  '<div class="verdict bad" id="vd3"></div><div id="kv3" style="margin-top:8px"></div><div><div class="barrow"><span>a² + b²</span><div class="bar"><i id="bar3s"></i></div><b id="bar3sv">0</b></div><div class="barrow"><span>c²</span><div class="bar"><i class="c" id="bar3c"></i></div><b id="bar3cv">0</b></div></div>'+
  '<div class="eq" id="eq3" style="margin-top:10px"></div><div class="chips" id="chips3"><span class="chip" data-type="siku">Siku-siku</span><span class="chip" data-type="lancip">Lancip</span><span class="chip" data-type="tumpul">Tumpul</span></div><div class="chips" id="chips3b"><span class="chip" data-s="Sama Sisi">Sama sisi</span><span class="chip" data-s="Sama Kaki">Sama kaki</span><span class="chip" data-s="Sembarang">Sembarang</span></div><div class="note" id="note3"></div>');
h+=shell('p4',
  '<div class="modebtns"><button class="modebtn on" data-mode="45">45°–45°–90°<small>siku-siku sama kaki</small></button><button class="modebtn" data-mode="30">30°–60°–90°<small>setengah segitiga sama sisi</small></button></div>'+
  '<div class="ctl"><button class="btn" id="btn4play">▶ Animasikan Asal-usulnya</button></div>'+
  '<div class="ctl"><label id="l4s">Panjang kaki (s) <span class="val">2</span></label>'+slider('s4',1,10,2)+
  '<div class="trio" style="grid-template-columns:1fr;margin-top:4px"><input type="text" id="t4s" value="2" inputmode="text" autocomplete="off" placeholder="mis. 2, √2, 3√2, akar 5" style="font-size:16px"></div>'+
  '<div class="chips" id="chips4"><span class="chip" data-ins="1">√</span><span class="chip" data-v="2">2</span><span class="chip" data-v="√2">√2</span><span class="chip" data-v="√3">√3</span><span class="chip" data-v="2√3">2√3</span><span class="chip" data-v="3√2">3√2</span><span class="chip" data-v="√5">√5</span></div>'+
  '<div class="note bad" id="e4" style="display:none"></div></div>'+steps('steps4',['Pilih Mode','Atur s','Bandingkan','Simpulkan']),
  'perbandingan sisi, keliling, dan luas',
  '<div class="eq" id="eq4"></div><div class="tblwrap" style="max-height:210px"><table class="tbl" id="tbl4"></table></div><div class="note" id="note4"></div>');
h+=shell('p5',
  '<div class="ctl"><label>Pilih situasi nyata</label><div class="chips" id="chips5"><span class="chip sel" data-sc="tangga">🪜 Tangga &amp; Dinding</span><span class="chip" data-sc="layar">📺 Layar TV</span><span class="chip" data-sc="lapangan">⚽ Lapangan</span></div></div>'+
  '<div class="ctl" id="find5wrap"><label>Yang dicari</label><div class="chips" id="chips5f"><span class="chip sel" data-f="diag">Sisi miring (diagonal)</span><span class="chip" data-f="side">Sisi tegak</span></div></div><div class="ctl"><label id="l5a"></label>'+slider('s5a',2,10,4)+'</div><div class="ctl"><label id="l5b"></label>'+slider('s5b',3,15,5)+'</div>'+

['t2a','t2b','t2c'].forEach(function(id){$('#'+id).addEventListener('input',function(){
  var bad=['t2a','t2b','t2c'].some(function(i){var v=$('#'+i).value.trim();return v!==''&&(!/^[0-9]+$/.test(v)||+v<1||+v>100)});
  if(bad){var n=$('#note2');n.className='note bad';n.innerHTML='⚠️ Masukkan bilangan <b>bulat positif 1–100</b>. Nilai 0, negatif, atau desimal tidak dipakai dan diubah ke nilai terdekat.'}})});
})();
</script>
</body>
</html>
